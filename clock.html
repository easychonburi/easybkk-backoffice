<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Easy - Bubble | บันทึกเวลา</title><meta name="theme-color" content="#244b67"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Easy Bubble"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png"><link rel="stylesheet" href="styles.css"></head>
<body>
<header class="topbar"><div class="topbar-inner"><div class="brand">Easy - Bubble<small>ระบบบันทึกเวลาพนักงาน</small></div><button class="btn btn-ghost" onclick="logout()">ออกจากระบบ</button></div></header>
<main class="container grid">
  <section class="card"><div class="grid grid-2" style="align-items:center"><div><p class="muted" style="margin:0">สวัสดี</p><h1 class="title" id="name">—</h1><p class="muted" id="branch">กำลังโหลดข้อมูล...</p></div><div style="text-align:center"><div class="big-number" id="clock">--:--:--</div><div class="muted" id="date">—</div></div></div></section>
  <section class="card"><h2 class="title">บันทึกเวลาวันนี้</h2><div id="gps" class="notice">📍 กดปุ่มด้านล่าง ระบบจะตรวจสอบตำแหน่งให้อัตโนมัติ</div><div class="grid grid-2" style="margin-top:18px"><button id="inBtn" class="btn btn-success btn-large" onclick="clockAction('clockIn')">เข้างาน</button><button id="outBtn" class="btn btn-primary btn-large" onclick="clockAction('clockOut')">ออกงาน</button></div><div id="today" style="margin-top:18px"></div></section>
  <section class="card"><h2 class="title">ประวัติล่าสุด</h2><div id="history" class="empty">กำลังโหลด...</div></section>
</main><div class="toast" id="toast"></div><div class="loading-overlay" id="globalLoading" role="status" aria-live="assertive"><div class="loading-card"><div class="loader"></div><strong id="loadingText">กำลังโหลดข้อมูล...</strong><small>กรุณารอสักครู่ ไม่ต้องกดซ้ำ</small></div></div><script src="config.js"></script><script>
const API=window.EASY_BUBBLE_API_URL;let session;
try{session=JSON.parse(localStorage.getItem('eb_session'))}catch{}if(!session||session.expires<Date.now())location.href='index.html';
const toast=t=>{const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2800)};
let loadingDepth=0;const loadingMessages={myDashboard:'กำลังโหลดข้อมูล...',clockIn:'กำลังบันทึกเวลาเข้างาน...',clockOut:'กำลังบันทึกเวลาออกงาน...'};
function startLoading(text){loadingDepth++;loadingText.textContent=text||'กำลังดำเนินการ...';globalLoading.classList.add('show');document.body.classList.add('is-loading')}
function stopLoading(){loadingDepth=Math.max(0,loadingDepth-1);if(!loadingDepth){globalLoading.classList.remove('show');document.body.classList.remove('is-loading')}}
const fmt=d=>new Intl.DateTimeFormat('th-TH',{dateStyle:'full'}).format(d);setInterval(()=>{const n=new Date();clock.textContent=n.toLocaleTimeString('th-TH');date.textContent=fmt(n)},500);
name.textContent=session.nickname||session.name;branch.textContent='สาขาประจำ: '+(session.branch_name||'—');
async function call(action,body={}){startLoading(loadingMessages[action]);try{const r=await fetch(API,{method:'POST',body:JSON.stringify({action,token:session.token,...body})});const j=await r.json();if(!j.success)throw Error(j.message||'ทำรายการไม่สำเร็จ');return j.data}finally{stopLoading()}}
function position(){return new Promise((ok,no)=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>ok({lat:p.coords.latitude,lng:p.coords.longitude}),()=>no(Error('ไม่สามารถอ่าน GPS ได้ กรุณาเปิดตำแหน่งและลองใหม่')),{enableHighAccuracy:true,timeout:15000,maximumAge:0}):no(Error('อุปกรณ์นี้ไม่รองรับ GPS')))}
async function clockAction(action){const btn=action==='clockIn'?inBtn:outBtn;btn.disabled=true;gps.textContent='📍 กำลังตรวจสอบตำแหน่ง...';startLoading('กำลังตรวจสอบตำแหน่ง GPS...');try{const p=await position();gps.textContent='📍 พบตำแหน่งแล้ว กำลังบันทึก...';stopLoading();const data=await call(action,p);toast(action==='clockIn'?'บันทึกเข้างานเรียบร้อย':'บันทึกออกงานเรียบร้อย');await load()}catch(e){toast(e.message);gps.textContent='⚠️ '+e.message}finally{stopLoading();btn.disabled=false}}
async function load(){try{const d=await call('myDashboard'),s=d.shift||{},t=d.today;branch.textContent=`สาขาประจำ: ${session.branch_name||'—'} · กะประจำ: ${s.name||'—'} ${s.start_time?`(${s.start_time}–${s.end_time})`:''}`;inBtn.disabled=!!t?.clock_in;outBtn.disabled=!t?.clock_in||!!t?.clock_out;today.innerHTML=t?`<div class="notice" style="margin-bottom:14px">กะวันนี้: <b>${t.shift_name||s.name||'—'}</b> ${t.shift_start?`(${t.shift_start}–${t.shift_end})`:''}</div><div class="grid grid-3"><div><span class="muted">เวลาเข้า</span><div class="title">${t.clock_in||'—'}</div></div><div><span class="muted">เวลาออก</span><div class="title">${t.clock_out||'—'}</div></div><div><span class="muted">สถานะ</span><div><span class="status ${t.clock_out?'status-ok':'status-warn'}">${t.clock_out?'ครบแล้ว':'กำลังทำงาน'}</span></div></div></div>`:'<div class="empty">ยังไม่ได้บันทึกเข้างานวันนี้</div>';history.innerHTML=d.history.length?`<div class="table-wrap"><table><thead><tr><th>วันที่</th><th>กะ</th><th>เข้า</th><th>ออก</th><th>OT</th></tr></thead><tbody>${d.history.map(x=>`<tr><td data-label="วันที่">${x.date}</td><td data-label="กะ">${x.shift_name||'—'}</td><td data-label="เวลาเข้า">${x.clock_in||'—'}</td><td data-label="เวลาออก">${x.clock_out||'—'}</td><td data-label="OT">${Number(x.ot_hours||0).toFixed(1)} ชม.</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">ยังไม่มีประวัติ</div>'}catch(e){toast(e.message)}}load();
function logout(){localStorage.removeItem('eb_session');location.href='index.html'}
</script><script src="pwa.js"></script></body></html>
